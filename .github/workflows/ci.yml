name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Legal texts are built from their sources
        run: pnpm --filter @hub/legal build && git diff --exit-code packages/legal/src/docs.generated.ts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm i18n:check
      # Unit tests + tenant-isolation (RLS) tests on real Postgres 17 (embedded, no Docker needed).
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high
      - name: E2E (Chromium, local test mode)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: .local/screenshots
          if-no-files-found: ignore
